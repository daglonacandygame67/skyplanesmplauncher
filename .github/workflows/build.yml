name: Build launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install portablemc==5.0.6 pillow pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name SkyPlaneSMP --icon icon.ico --add-data "bg.png;." --add-data "logo.png;." --add-data "icon.ico;." --collect-all portablemc launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPlaneSMP
          path: dist/SkyPlaneSMP.exe
